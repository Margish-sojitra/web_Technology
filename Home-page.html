    <script>
        $body = $("body");
        $('#btnRegister').on('click', function () {
            window.location.href = "/Registration.aspx"
        });

        $(document).on({
            ajaxStart: function () { $body.addClass("loading"); },
            ajaxStop: function () { $body.removeClass("loading"); }
        });

        function SubmitForm() {
            if (validateForOnlyNumbers(document.querySelector("#txtOtp")) && validateMobileNumberOrEmailID(document.querySelector("#txtEmailOrMobile")))
                $('#btnLogin')[0].click();
        }
    </script>
    <script>
        let secondsRemaining = 0;
        let enableResend = false;

        $(document).ready(function () {
            setTimeout(function () {
                window.history.forward(1);
            }, 100)

            $(window).keydown(function (event) {
                if (event.keyCode === 13) {
                    event.preventDefault();
                    return false;
                }
            });

            const error = '';
            if (error != '') {
                const alertBox = $('.alert-boxes-holder');
                setTimeout(function () {
                    $('.alert-boxes-holder').removeClass('hidden');
                    alertBox[0].children[0].innerHTML = error;
                }, 1000)
                setTimeout(function () {
                    alertBox[0].children[0].classList.add('alert-box-hidden');
                }, 1100)
                setTimeout(function () {
                    $('.alert-boxes-holder').addClass('hidden');
                    alertBox[0].children[0].classList.remove('alert-box-hidden');
                    alertBox[0].children[0].innerHTML = "";
                }, 11000)
            }
        });

        const timer = function () {
            setTimeout(() => {
                if (secondsRemaining > 0) {
                    document.getElementById("otp-timer").textContent = `You can get a new OTP after ${secondsRemaining} seconds`;
                    secondsRemaining--;
                    timer();
                } else {
                    document.getElementById("otp-timer").textContent = ``;
                    document.getElementById("btnOtpResend").classList.remove('button-disabled');
                }
            }, 1000);
        }

        timer();

        function resendCode() {
            if (secondsRemaining <= 0 && validateMobileNumberOrEmailID(document.querySelector("#txtEmailOrMobile"))) {
                document.getElementById("btnOtpResend").classList.add('button-disabled');
                document.getElementById("otp-timer").textContent = "Sending...";
                const userData = { 'value': document.querySelector('#txtEmailOrMobile').value }
                console.log(userData);
                $.ajax({
                    url: '/Service/OTPService.asmx/ReSendOTPLogin',
                    method: 'post',
                    contentType: 'application/json',
                    data: JSON.stringify(userData),
                    dataType: 'json',
                    success: function (data) {
                        console.log(data.d.output)
                        if (data.d.output === "success") {
                            secondsRemaining = 60;
                            document.getElementById("btnOtpResend").classList.add('button-disabled');
                            document.getElementById("otp-timer").textContent = "Sending...";
                            const alertBox = $('.alert-boxes-holder');
                            alertBox[0].children[1].innerHTML = data.d.message;
                            setTimeout(function () {
                                $('.alert-boxes-holder').removeClass('hidden');
                            }, 1000)
                            setTimeout(function () {
                                alertBox[0].children[1].classList.add('alert-box-hidden');
                            }, 1100)
                            setTimeout(function () {
                                $('.alert-boxes-holder').addClass('hidden');
                                alertBox[0].children[1].classList.remove('alert-box-hidden');
                                alertBox[0].children[1].innerHTML = "";
                            }, 11000)
                            timer();
                        }
                        else {

                            const alertBox = $('.alert-boxes-holder');
                            alertBox[0].children[0].innerHTML = data.d.output;
                            setTimeout(function () {
                                $('.alert-boxes-holder').removeClass('hidden');
                            }, 1000)
                            setTimeout(function () {
                                alertBox[0].children[0].classList.add('alert-box-hidden');
                            }, 1100)
                            setTimeout(function () {
                                $('.alert-boxes-holder').addClass('hidden');
                                alertBox[0].children[0].classList.remove('alert-box-hidden');
                                alertBox[0].children[0].innerHTML = "";

                            }, 11000)
                            secondsRemaining = 60;
                            document.getElementById("btnOtpResend").classList.add('button-disabled');
                            document.getElementById("otp-timer").textContent = "";
                            timer();
                        }
                    },
                    error: function (error) {
                    }
                })
            }
        }
    </script>
