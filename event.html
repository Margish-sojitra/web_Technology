<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events</title>
    <link rel="stylesheet" href="Event.css">
</head>
<body>

    <header>
        <h1>Campus Events</h1>
        <p>Join upcoming student activities.</p>
    </header>

    <div class="grid">
        <div class="card">
            <span class="tech">Tech</span>
            <h3>Hackathon 2026</h3>
            <p class="date">Oct 15 | 9 AM</p>
            <p>Build projects and win prizes.</p>
            <a href="#" class="btn">Register</a>
        </div>

        <div class="card">
            <span class="sports">Sports</span>
            <h3>Football Cup</h3>
            <p class="date">Oct 22 | 3 PM</p>
            <p>Inter-department match.</p>
            <a href="#" class="btn">Register</a>
        </div>

        <div class="card">
            <span class="arts">Cultural</span>
            <h3>Music Festival</h3>
            <p class="date">Nov 05 | 6 PM</p>
            <p>Live student band performances.</p>
            <a href="#" class="btn">Register</a>
        </div>
    </div>

</body>
</html>
